name: Apply Nobitex minimum-order rounding hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-min-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, openssl
      - name: Apply patch
        run: python3 tools/apply_min_order_hotfix.py
      - name: Validate patch
        run: |
          php -l backend/src/Trading/NobitexOrderSizing.php
          php -l backend/src/Trading/NobitexPortfolioEngine.php
          php backend/tests/nobitex_minimum_order_rounding_test.php
      - name: Commit hotfix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Trading/NobitexPortfolioEngine.php backend/src/Trading/NobitexOrderSizing.php backend/tests/nobitex_minimum_order_rounding_test.php .github/workflows/php-lint.yml
          git commit -m 'Fix Nobitex minimum-order precision rounding'
          git push origin HEAD:main
