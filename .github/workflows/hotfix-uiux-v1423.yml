name: Apply Trade 1.4.23 UI UX debug

on:
  push:
    paths:
      - '.github/workflows/hotfix-uiux-v1423.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply UI UX debug patch
        run: python3 tools/apply_uiux_debug_v1423.py
      - name: Validate admin UI UX regressions
        run: |
          php -l backend/public/admin/_nav.php
          php -l backend/tests/admin_mobile_layout_test.php
          php -l backend/tests/uiux_debug_v1423_test.php
          php backend/tests/admin_mobile_layout_test.php
          php backend/tests/uiux_debug_v1423_test.php
      - name: Compile Android UI
        working-directory: android
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Commit UI UX fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/public/admin/_nav.php \
                  backend/public/admin/assets/cockpit-ui.css \
                  backend/public/admin/assets/cockpit.js \
                  android/app/src/main/java/ir/trade/app/ui/TradeAppV4.kt \
                  backend/tests/uiux_debug_v1423_test.php
          git commit -m 'Debug admin and Android UI UX'
          git push origin HEAD:main
