name: Backend Alert Truth Hotfix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-alert-truth-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stale alert recovery and active alert truth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          center_path = Path('backend/src/Trading/TradeCommandCenter.php')
          center = center_path.read_text()
          pattern = re.compile(r"    private function alerts\(PDO \$pdo,array \$status,float \$accountDd\):array\n    \{.*?\n    \}\n\n    private function accountEquity", re.S)
          replacement = r'''    private function alerts(PDO $pdo,array $status,float $accountDd):array
    {
        $alerts=[];
        $n=$status['exchanges']['nobitex']??[];
        if(!($n['credentials_configured']??false))$alerts[]=$this->alert('critical','api','Nobitex API تنظیم نشده','اتصال صرافی آماده نیست.');
        if(!($status['cron_health']['healthy']??false))$alerts[]=$this->alert('critical','system','Cron سالم نیست','آخرین اجرای موتور قدیمی یا ناموفق است.');
        $c=$this->entryCircuit($pdo);
        if($c['open'])$alerts[]=$this->alert('warning','risk','Circuit باز است',(string)($c['reason']??'ورود جدید موقتاً متوقف شده است.'));
        $fails=$this->intSetting($pdo,'nobitex_runtime_api_failures',0,0,1000);
        if($fails>0)$alerts[]=$this->alert($fails>=3?'critical':'warning','api','خطای متوالی API',$fails.' خطای متوالی ثبت شده است.');
        $pending=(int)($n['portfolio_capacity']['pending_orders']??0);
        if($pending>0)$alerts[]=$this->alert('warning','execution','سفارش Pending وجود دارد',$pending.' سفارش در انتظار reconcile/fill است.');
        if($accountDd>=2)$alerts[]=$this->alert($accountDd>=6?'critical':'warning','risk','افت ارزش کیف پول بالا','افت ارزش کیف پول از سقف ثبت‌شده '.round($accountDd,2).'% است؛ این شاخص هنوز اثر واریز/برداشت را خنثی نمی‌کند.');

        // Notification history is not the same thing as current system health.
        // Only fresh, actionable system/risk/execution notifications are promoted
        // into the Home alert stack. Trade outcomes stay in the timeline/reports.
        $currentBackend=\Trade\Updater::currentVersion();
        $recent=(new TradeNotificationCenter())->recent(50,true,$pdo);
        foreach($recent as $r){
            if(!self::isCurrentAlertNotification($r,$currentBackend))continue;
            $alerts[]=['priority'=>$r['priority'],'category'=>$r['category'],'title'=>$r['title'],'body'=>$r['body'],'created_at'=>$r['created_at']];
        }
        return array_slice($alerts,0,20);
    }

    public static function isCurrentAlertNotification(array $row,string $currentBackendVersion,?int $now=null):bool
    {
        $priority=strtolower(trim((string)($row['priority']??'')));
        if(!in_array($priority,['warning','critical'],true))return false;
        $category=strtolower(trim((string)($row['category']??'')));
        if(!in_array($category,['system','risk','api','execution'],true))return false;

        $ctx=is_array($row['context']??null)?$row['context']:[];
        $eventKey=(string)($row['event_key']??'');
        $sourceTime=trim((string)($ctx['source_created_at']??$row['created_at']??''));
        if($sourceTime!==''){
            $hasZone=(bool)preg_match('/(?:Z|[+-]\d{2}:?\d{2})$/i',$sourceTime);
            $ts=strtotime($sourceTime.($hasZone?'':' UTC'));
            $now??=time();
            if($ts!==false&&$ts<$now-1800)return false;
            if(str_starts_with($eventKey,'nobitex-event:')&&$ts!==false&&$ts<$now-600)return false;
        }

        if(str_starts_with($eventKey,'bot-run-failed:')){
            $alertVersion=trim((string)($ctx['backend_version']??''));
            if($alertVersion!==''&&$currentBackendVersion!==''&&$alertVersion!==$currentBackendVersion)return false;
            if(strtolower((string)($ctx['status']??'failed'))!=='failed')return false;
        }
        return true;
    }

    private function accountEquity'''
          center2, count = pattern.subn(replacement, center, count=1)
          if count != 1:
              raise SystemExit(f'alerts() patch count={count}')
          center_path.write_text(center2)

          notification_path = Path('backend/src/Trading/TradeNotificationCenter.php')
          notification = notification_path.read_text()
          sync_pattern = re.compile(r"    private function syncSources\(PDO \$pdo\):void\n    \{.*?\n    \}\n\n    private function mapTradingEvent", re.S)
          sync_replacement = r'''    private function syncSources(PDO $pdo):void
    {
        try{
            // Do not resurrect ancient event rows as newly-created unread alerts.
            $events=$pdo->query("SELECT id,level,event_name,context_json,created_at FROM nobitex_autotrade_events WHERE created_at >= (UTC_TIMESTAMP() - INTERVAL 30 MINUTE) ORDER BY id DESC LIMIT 160")->fetchAll();
            foreach(array_reverse($events)as$e){
                $name=(string)$e['event_name'];$ctx=json_decode((string)($e['context_json']??''),true);if(!is_array($ctx))$ctx=[];
                [$category,$priority,$title,$body]=$this->mapTradingEvent($name,(string)$e['level'],$ctx);
                if($title==='')continue;
                $this->emit('nobitex-event:'.$e['id'],$category,$priority,$title,$body,$ctx+['event_name'=>$name,'source_created_at'=>$e['created_at']],$pdo);
            }
        }catch(\Throwable){}

        try{
            $pdo->exec("UPDATE trade_notifications SET read_at=COALESCE(read_at,UTC_TIMESTAMP())
                WHERE read_at IS NULL
                  AND event_key LIKE 'bot-run-failed:%'
                  AND body='یکی از چرخه‌های Cron با وضعیت failed پایان یافته است.'");

            // A successful newer bot run resolves every failed-run warning from
            // the previous failure streak. The success id is embedded in new
            // event keys so a later failure in the same 10-minute bucket can
            // become visible again without reviving an already-resolved warning.
            $lastSuccessId=(int)$pdo->query("SELECT COALESCE(MAX(id),0) FROM bot_runs WHERE status='success'")->fetchColumn();
            $recoverySuffix=':s'.$lastSuccessId;
            $cleanup=$pdo->prepare("UPDATE trade_notifications SET read_at=COALESCE(read_at,UTC_TIMESTAMP())
                WHERE read_at IS NULL
                  AND event_key LIKE 'bot-run-failed:%'
                  AND event_key NOT LIKE :suffix");
            $cleanup->execute([':suffix'=>'%'.$recoverySuffix]);

            $runs=$pdo->query("SELECT id,run_id,status,summary_json,started_at,finished_at
                FROM bot_runs
                WHERE status='failed'
                  AND id > {$lastSuccessId}
                  AND COALESCE(finished_at,started_at) >= (UTC_TIMESTAMP() - INTERVAL 30 MINUTE)
                ORDER BY id DESC LIMIT 30")->fetchAll();

            foreach($runs as$r){
                $diag=self::failedRunDiagnostic($r);
                $bucket=intdiv((int)$diag['timestamp'],600);
                $eventKey='bot-run-failed:'.$diag['fingerprint'].':'.$bucket.$recoverySuffix;
                $exchangeLabel=$diag['exchange']==='unknown'?'نامشخص':strtoupper((string)$diag['exchange']);
                $body='چرخه Cron برای '.$exchangeLabel.' با خطا پایان یافت. علت: '.$diag['reason'];
                if($diag['backend_version']!=='')$body.=' | Backend '.$diag['backend_version'];
                $this->emit($eventKey,'system','warning','خطای اجرای ربات',$body,[
                    'run_id'=>$diag['run_id'],'exchange'=>$diag['exchange'],'status'=>'failed','reason'=>$diag['reason'],
                    'backend_version'=>$diag['backend_version'],'started_at'=>$r['started_at']??null,'finished_at'=>$r['finished_at']??null,
                    'recovery_anchor_success_id'=>$lastSuccessId,
                ],$pdo);
            }
        }catch(\Throwable){}
    }

    private function mapTradingEvent'''
          notification2, count = sync_pattern.subn(sync_replacement, notification, count=1)
          if count != 1:
              raise SystemExit(f'syncSources() patch count={count}')
          old_scan = "if(str_contains($name,'scan_failed')||str_contains($name,'reconcile.error'))return['system','warning','خطای پایش بازار',$symbol!==''?$symbol.' در این چرخه کامل پایش نشد.':'یکی از مراحل پایش بازار ناموفق بود.'];"
          new_scan = "if(str_contains($name,'scan_failed')||str_contains($name,'reconcile.error'))return['system','warning','پایش ناقص بازار',$symbol!==''?$symbol.' در این چرخه کامل پایش نشد.':'یکی از مراحل پایش بازار در این چرخه کامل نشد.'];"
          if old_scan not in notification2:
              raise SystemExit('scan warning mapping not found')
          notification2 = notification2.replace(old_scan, new_scan, 1)
          notification_path.write_text(notification2)

          failed_test_path = Path('backend/tests/failed_run_notification_test.php')
          failed_test = failed_test_path.read_text()
          marker = "expectFailedRun(str_contains($source,\"body='یکی از چرخه‌های Cron با وضعیت failed پایان یافته است.'\"),'Legacy generic failed-run alerts must be recognized for cleanup.');\n"
          additions = marker + "expectFailedRun(str_contains($source,\"MAX(id),0) FROM bot_runs WHERE status='success'\"),'Failed-run alerts must be anchored to the latest successful recovery.');\nexpectFailedRun(str_contains($source,'id > {$lastSuccessId}'),'Only failures after the latest successful run may remain active.');\nexpectFailedRun(str_contains($source,\"nobitex_autotrade_events WHERE created_at >= (UTC_TIMESTAMP() - INTERVAL 30 MINUTE)\"),'Trading-event notification sync must not resurrect ancient events.');\nexpectFailedRun(str_contains($source,\"$recoverySuffix=':s'.$lastSuccessId\"),'Failure dedupe keys must be recovery-streak aware.');\n"
          if marker not in failed_test:
              raise SystemExit('failed-run test marker not found')
          failed_test_path.write_text(failed_test.replace(marker, additions, 1))

          center_test_path = Path('backend/tests/command_center_test.php')
          center_test = center_test_path.read_text()
          marker2 = "expectCommandCenter(str_contains($centerSource,\"cash_flow_adjusted'=>false\"), 'Raw wallet drawdown must disclose that deposits/withdrawals are not normalized.');\n"
          tests = marker2 + r'''
$now=strtotime('2026-09-13 10:00:00 UTC');
expectCommandCenter(!TradeCommandCenter::isCurrentAlertNotification([
    'event_key'=>'nobitex-event:1','priority'=>'warning','category'=>'performance','created_at'=>'2026-09-13 09:59:00','context'=>[]
],'1.4.49',$now),'Closed losing trades belong to timeline/reports, not the active alert stack.');
expectCommandCenter(!TradeCommandCenter::isCurrentAlertNotification([
    'event_key'=>'bot-run-failed:old','priority'=>'warning','category'=>'system','created_at'=>'2026-09-13 09:59:00','context'=>['backend_version'=>'1.4.43','status'=>'failed']
],'1.4.49',$now),'Failed-run warnings from an older backend version must not be promoted as current alerts.');
expectCommandCenter(!TradeCommandCenter::isCurrentAlertNotification([
    'event_key'=>'nobitex-event:2','priority'=>'warning','category'=>'system','created_at'=>'2026-09-13 09:59:00','context'=>['source_created_at'=>'2026-09-13 09:40:00']
],'1.4.49',$now),'Transient market-scan warnings must expire quickly.');
expectCommandCenter(TradeCommandCenter::isCurrentAlertNotification([
    'event_key'=>'bot-run-failed:current','priority'=>'warning','category'=>'system','created_at'=>'2026-09-13 09:59:00','context'=>['backend_version'=>'1.4.49','status'=>'failed']
],'1.4.49',$now),'A fresh current-version failed run must remain visible.');
'''
          if marker2 not in center_test:
              raise SystemExit('command-center test marker not found')
          center_test_path.write_text(center_test.replace(marker2, tests, 1))

          version_path = Path('backend/version.php')
          version = version_path.read_text()
          if "return '1.4.48';" not in version:
              raise SystemExit('expected backend version 1.4.48 not found')
          version = version.replace("// Android 1.4.48: duplicate-safe LazyColumn keys, Row-safe pills and localized decision fallback.\nreturn '1.4.48';",
                                    "// Android 1.4.48: duplicate-safe LazyColumn keys, Row-safe pills and localized decision fallback.\n// 1.4.49: recovered/stale notifications no longer masquerade as active system alerts.\nreturn '1.4.49';")
          version_path.write_text(version)

          workflow = Path('.github/workflows/backend-alert-truth-hotfix-once.yml')
          workflow.unlink()
          PY

          php -l backend/src/Trading/TradeNotificationCenter.php
          php -l backend/src/Trading/TradeCommandCenter.php
          php backend/tests/failed_run_notification_test.php
          php backend/tests/command_center_test.php

          git config user.name 'hazhanhasani'
          git config user.email 'hazhanhasani4268@atomicmail.io'
          git add -A
          git commit -m 'Fix stale Trade alerts and recovery truth as 1.4.49'
          git push origin HEAD:main
