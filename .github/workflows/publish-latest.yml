name: Publish Latest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'android/**'
      - '.github/workflows/publish-latest.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: trade-publish-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Resolve unified release version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_VERSION=$(php -r "echo require 'backend/version.php';")
          if [[ ! "$BACKEND_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::backend/version.php must contain a semantic version like 1.3.2"
            exit 1
          fi

          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "::error::Version minor/patch must be <= 999 for deterministic Android versionCode generation."
            exit 1
          fi
          ANDROID_VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( ANDROID_VERSION_CODE < 1 || ANDROID_VERSION_CODE > 2100000000 )); then
            echo "::error::Generated Android versionCode is outside the supported range."
            exit 1
          fi

          PREVIOUS_JSON=$(curl -fsSL --connect-timeout 5 --max-time 10 \
            'https://github.com/hazhanhasani/Trade/releases/download/trade-latest/latest.json' 2>/dev/null || true)
          PREVIOUS_VERSION=$(printf '%s' "$PREVIOUS_JSON" | jq -r '.release.version // .backend.version // empty' 2>/dev/null || true)
          PREVIOUS_CODE=$(printf '%s' "$PREVIOUS_JSON" | jq -r '.android.version_code // 0' 2>/dev/null || echo 0)

          if [[ -n "$PREVIOUS_VERSION" ]]; then
            if [[ "$BACKEND_VERSION" == "$PREVIOUS_VERSION" ]]; then
              PREVIOUS_SHA=$(git rev-list -n1 trade-latest 2>/dev/null || true)
              if [[ "$PREVIOUS_SHA" != "$GITHUB_SHA" ]]; then
                echo "::error::Code changed without a coordinated version bump. Update backend/version.php before publishing."
                exit 1
              fi
            else
              if ! php -r "exit(version_compare('$BACKEND_VERSION', '$PREVIOUS_VERSION', '>') ? 0 : 1);"; then
                echo "::error::Release version must move forward from $PREVIOUS_VERSION to a newer semantic version."
                exit 1
              fi
              if (( ANDROID_VERSION_CODE <= PREVIOUS_CODE )); then
                echo "::error::Android versionCode must increase monotonically."
                exit 1
              fi
            fi
          fi

          echo "backend=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_name=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Unified release: $BACKEND_VERSION (Android code $ANDROID_VERSION_CODE)"

      - name: Validate PHP
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Package cPanel backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/backend
          cp -a backend/. dist/backend/
          rm -f dist/backend/storage/config.php \
                dist/backend/storage/install.lock \
                dist/backend/storage/*.log \
                dist/backend/storage/update-state.json \
                dist/backend/storage/maintenance.lock
          rm -rf dist/backend/storage/backups dist/backend/storage/updates dist/backend/storage/android-signing
          (
            cd dist/backend
            zip -qr ../Trade-cPanel.zip .
          )
          rm -rf dist/backend
          test -s dist/Trade-cPanel.zip

      - name: Resolve permanent Android signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -u
          normalize_fp() { printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'; }
          PREVIOUS_CERT=$(curl -fsSL --connect-timeout 5 --max-time 10 \
            'https://github.com/hazhanhasani/Trade/releases/download/trade-latest/latest.json' 2>/dev/null \
            | jq -r '.android.signing.cert_sha256 // empty' 2>/dev/null || true)
          PREVIOUS_CERT=$(normalize_fp "$PREVIOUS_CERT")

          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/trade-release.jks"
            test -s "$RUNNER_TEMP/trade-release.jks"
            CERT=$(keytool -list -v -keystore "$RUNNER_TEMP/trade-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
            CERT=$(normalize_fp "$CERT")
            if [[ -z "$CERT" ]]; then
              echo "::error::Unable to read certificate fingerprint from GitHub Secrets keystore."
              exit 1
            fi
            if [[ -n "$PREVIOUS_CERT" && "$CERT" != "$PREVIOUS_CERT" ]]; then
              echo "::error::Permanent signer mismatch. Refusing to replace the established Android signing identity."
              exit 1
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/trade-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "ANDROID_KEYSTORE_TYPE=JKS"
            } >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "source=github-secrets" >> "$GITHUB_OUTPUT"
            echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OIDC_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          if [[ "$OIDC_URL" == *'?'* ]]; then SEP='&'; else SEP='?'; fi
          OIDC_RESPONSE=$(curl -fsS --connect-timeout 5 --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${OIDC_URL}${SEP}audience=trade-android-signing" 2>/dev/null || true)
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value // empty' 2>/dev/null || true)

          if [[ -n "$OIDC_TOKEN" ]]; then
            HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 20 \
              -o "$RUNNER_TEMP/cpanel-signing.json" -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H 'Accept: application/json' \
              'https://rado-taxi.sbs/internal/android-signing.php' || true)
            if [[ "$HTTP_CODE" == '200' ]] && jq -e '.ok == true' "$RUNNER_TEMP/cpanel-signing.json" >/dev/null 2>&1; then
              PASSWORD=$(jq -r '.signing.password' "$RUNNER_TEMP/cpanel-signing.json")
              ALIAS=$(jq -r '.signing.alias' "$RUNNER_TEMP/cpanel-signing.json")
              EXPECTED=$(jq -r '.signing.cert_sha256' "$RUNNER_TEMP/cpanel-signing.json")
              EXPECTED=$(normalize_fp "$EXPECTED")
              echo "::add-mask::$PASSWORD"
              jq -r '.signing.pkcs12_base64' "$RUNNER_TEMP/cpanel-signing.json" | base64 --decode > "$RUNNER_TEMP/trade-release.p12"
              test -s "$RUNNER_TEMP/trade-release.p12"
              CERT=$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/trade-release.p12" -storepass "$PASSWORD" -alias "$ALIAS" 2>/dev/null \
                | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
              CERT=$(normalize_fp "$CERT")
              if [[ -z "$CERT" || "$CERT" != "$EXPECTED" ]]; then
                echo "::error::cPanel signing bundle certificate fingerprint verification failed."
                exit 1
              fi
              if [[ -n "$PREVIOUS_CERT" && "$CERT" != "$PREVIOUS_CERT" ]]; then
                echo "::error::Permanent signer mismatch. Refusing to rotate the established Android signing identity."
                exit 1
              fi
              {
                echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/trade-release.p12"
                echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
                echo "ANDROID_KEY_ALIAS=$ALIAS"
                echo "ANDROID_KEY_PASSWORD=$PASSWORD"
                echo "ANDROID_KEYSTORE_TYPE=PKCS12"
              } >> "$GITHUB_ENV"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "source=cpanel-oidc" >> "$GITHUB_OUTPUT"
              echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "source=missing" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=" >> "$GITHUB_OUTPUT"
          echo "::error::Atomic release blocked: permanent Android signing is required so Backend and APK publish together."
          exit 1

      - name: Build permanently signed Android APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list \
            -storetype "$ANDROID_KEYSTORE_TYPE" \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../dist/Trade.apk
          test -s ../dist/Trade.apk

      - name: Verify Android signature
        id: apk_signature
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dist/Trade.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT_SHA=$(grep -E -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" | sed -E 's/^.*certificate SHA-256 digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ -z "$CERT_SHA" ] || [ "$CERT_SHA" != "$EXPECTED" ]; then
            echo "::error::Final APK signer does not match the permanent signing identity."
            exit 1
          fi
          echo "cert_sha256=$CERT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build coordinated update manifest
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.backend }}
          ANDROID_VERSION_CODE: ${{ steps.versions.outputs.android_code }}
          ANDROID_SIGNING_SOURCE: ${{ steps.signing.outputs.source }}
          ANDROID_CERT_SHA256: ${{ steps.apk_signature.outputs.cert_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Trade-cPanel.zip
          test -s dist/Trade.apk
          BACKEND_SHA=$(sha256sum dist/Trade-cPanel.zip | awk '{print $1}')
          ANDROID_SHA=$(sha256sum dist/Trade.apk | awk '{print $1}')
          ANDROID_URL='https://github.com/hazhanhasani/Trade/releases/download/trade-latest/Trade.apk'

          jq -n \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg backendSha "$BACKEND_SHA" \
            --argjson androidCode "$ANDROID_VERSION_CODE" \
            --arg androidSha "$ANDROID_SHA" \
            --arg androidUrl "$ANDROID_URL" \
            --arg signingSource "$ANDROID_SIGNING_SOURCE" \
            --arg signingCertSha256 "$ANDROID_CERT_SHA256" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema:2,published_at:$publishedAt,release:{version:$releaseVersion,coordinated:true},backend:{version:$releaseVersion,url:"https://github.com/hazhanhasani/Trade/releases/download/trade-latest/Trade-cPanel.zip",sha256:$backendSha},android:{available:true,version_code:$androidCode,version_name:$releaseVersion,required_backend_version:$releaseVersion,url:$androidUrl,sha256:$androidSha,signing:{status:"permanent",source:$signingSource,cert_sha256:$signingCertSha256}}}' \
            > dist/latest.json

          jq -e '.release.coordinated == true and .release.version == .backend.version and .backend.version == .android.version_name and .android.required_backend_version == .backend.version and .android.available == true' dist/latest.json >/dev/null

      - name: Publish stable release assets atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Trade-cPanel.zip
          test -s dist/Trade.apk
          test -s dist/latest.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f trade-latest "$GITHUB_SHA"
          git push origin refs/tags/trade-latest --force
          if gh release view trade-latest >/dev/null 2>&1; then
            gh release edit trade-latest --title "Trade Latest" --notes "Coordinated Backend + Android stable release." --target "$GITHUB_SHA"
          else
            gh release create trade-latest --title "Trade Latest" --notes "Coordinated Backend + Android stable release." --target "$GITHUB_SHA"
          fi
          gh release upload trade-latest dist/Trade-cPanel.zip dist/Trade.apk dist/latest.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Trade-latest-coordinated-release
          path: |
            dist/latest.json
            dist/Trade-cPanel.zip
            dist/Trade.apk
          if-no-files-found: error
