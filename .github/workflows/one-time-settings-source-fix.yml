name: One-time Trading Settings Source Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-settings-source-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry one-time trading settings source fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate trading settings source of truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          exec(base64.b64decode(''))
          PY
          php -l backend/public/admin/bot/index.php
          php -l backend/public/admin/bot/settings.php
          php -l backend/src/Trading/NobitexAutoTraderEngine.php
          php -l backend/tests/trading_admin_settings_regression_test.php
          php backend/tests/trading_admin_settings_regression_test.php
          php backend/tests/nobitex_runtime_safety_test.php
          git diff --check
      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/public/admin/bot/index.php backend/public/admin/bot/settings.php backend/src/Trading/NobitexAutoTraderEngine.php backend/tests/trading_admin_settings_regression_test.php backend/version.php
          git commit -m 'Release Trade 1.4.4 unify trading settings source'
          git push origin HEAD:main
