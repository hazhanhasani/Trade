name: Apply Trade 1.4.24 dashboard truth and theme debug

on:
  push:
    paths:
      - '.github/workflows/hotfix-debug-v1424.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, openssl
      - name: Apply dashboard truth, theme and log-noise fixes
        run: python3 tools/apply_debug_v1424.py
      - name: Validate focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_debug_v1424.py
          php -l backend/public/admin/_nav.php
          php -l backend/public/admin/live-dashboard.php
          php -l backend/src/Observability/BaleSystemAlert.php
          php -l backend/tests/dashboard_truth_v1424_test.php
          php backend/tests/admin_mobile_layout_test.php
          php backend/tests/uiux_debug_v1423_test.php
          php backend/tests/dashboard_truth_v1424_test.php
          php backend/tests/android_live_panel_parity_test.php
          php backend/tests/nobitex_runtime_safety_test.php
      - name: Commit fixes directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/public/admin/_nav.php \
                  backend/public/admin/assets/cockpit-ui.css \
                  backend/public/admin/assets/cockpit.js \
                  backend/public/admin/live-dashboard.php \
                  backend/src/Observability/BaleSystemAlert.php \
                  backend/tests/dashboard_truth_v1424_test.php \
                  .github/workflows/php-lint.yml \
                  backend/version.php
          git commit -m 'Debug dashboard truth, theme consistency and cron log noise'
          git push origin HEAD:main
