name: Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'backend/src/Security/AndroidSigningService.php'
      - 'backend/src/Security/GitHubOidcVerifier.php'
      - 'backend/public/internal/android-signing.php'
  pull_request:
    paths:
      - 'android/**'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Resolve permanent signing
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          normalize_fp() { printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'; }
          PREVIOUS_CERT=$(curl -fsSL --connect-timeout 5 --max-time 10 \
            'https://github.com/hazhanhasani/Trade/releases/download/trade-latest/latest.json' 2>/dev/null \
            | jq -r '.android.signing.cert_sha256 // empty' 2>/dev/null || true)
          PREVIOUS_CERT=$(normalize_fp "$PREVIOUS_CERT")

          if [[ -n "$KS_B64" && -n "$KS_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "::add-mask::$KS_PASS"
            echo "::add-mask::$KEY_PASS"
            printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/Trade-release.jks"
            CERT=$(keytool -list -v -keystore "$RUNNER_TEMP/Trade-release.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
            CERT=$(normalize_fp "$CERT")
            if [[ -z "$CERT" ]]; then echo "::error::Unable to read signing fingerprint."; exit 1; fi
            if [[ -n "$PREVIOUS_CERT" && "$CERT" != "$PREVIOUS_CERT" ]]; then
              echo "::error::Permanent signer mismatch."; exit 1
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/Trade-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
              echo "ANDROID_KEYSTORE_TYPE=JKS"
            } >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "source=github-secrets" >> "$GITHUB_OUTPUT"
            echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OIDC_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          if [[ "$OIDC_URL" == *'?'* ]]; then SEP='&'; else SEP='?'; fi
          OIDC=$(curl -fsS --connect-timeout 5 --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${OIDC_URL}${SEP}audience=trade-android-signing" 2>/dev/null | jq -r '.value // empty' 2>/dev/null || true)
          if [[ -n "$OIDC" ]]; then
            CODE=$(curl -sS --connect-timeout 5 --max-time 20 -o "$RUNNER_TEMP/cpanel-signing.json" -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $OIDC" -H 'Accept: application/json' \
              'https://rado-taxi.sbs/internal/android-signing.php' || true)
            if [[ "$CODE" == '200' ]] && jq -e '.ok == true' "$RUNNER_TEMP/cpanel-signing.json" >/dev/null 2>&1; then
              PASSWORD=$(jq -r '.signing.password' "$RUNNER_TEMP/cpanel-signing.json")
              ALIAS=$(jq -r '.signing.alias' "$RUNNER_TEMP/cpanel-signing.json")
              EXPECTED=$(normalize_fp "$(jq -r '.signing.cert_sha256' "$RUNNER_TEMP/cpanel-signing.json")")
              echo "::add-mask::$PASSWORD"
              jq -r '.signing.pkcs12_base64' "$RUNNER_TEMP/cpanel-signing.json" | base64 --decode > "$RUNNER_TEMP/Trade-release.p12"
              CERT=$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/Trade-release.p12" -storepass "$PASSWORD" -alias "$ALIAS" 2>/dev/null \
                | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
              CERT=$(normalize_fp "$CERT")
              if [[ -z "$CERT" || "$CERT" != "$EXPECTED" ]]; then echo "::error::cPanel signing bundle verification failed."; exit 1; fi
              if [[ -n "$PREVIOUS_CERT" && "$CERT" != "$PREVIOUS_CERT" ]]; then echo "::error::Permanent signer mismatch."; exit 1; fi
              {
                echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/Trade-release.p12"
                echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
                echo "ANDROID_KEY_ALIAS=$ALIAS"
                echo "ANDROID_KEY_PASSWORD=$PASSWORD"
                echo "ANDROID_KEYSTORE_TYPE=PKCS12"
              } >> "$GITHUB_ENV"
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "source=cpanel-oidc" >> "$GITHUB_OUTPUT"
              echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "source=missing" >> "$GITHUB_OUTPUT"
          echo "::warning::Permanent signing is not available yet. Compile validation only."

      - name: Compile-check pull request
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile-check when signing is unavailable
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled != 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate permanent keystore
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        shell: bash
        working-directory: .
        run: |
          keytool -list \
            -storetype "$ANDROID_KEYSTORE_TYPE" \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        shell: bash
        working-directory: .
        env:
          EXPECTED_CERT: ${{ steps.signing.outputs.cert_sha256 }}
        run: |
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          if [[ -z "$APKSIGNER" ]]; then echo "::error::apksigner was not found."; exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT=$(grep -E -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" | sed -E 's/^.*certificate SHA-256 digest:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$CERT" || "$CERT" != "$EXPECTED" ]]; then echo "::error::APK signer mismatch."; exit 1; fi

      - name: Upload permanently signed release APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Trade-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
