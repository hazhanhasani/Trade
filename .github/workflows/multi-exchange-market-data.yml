name: Multi-Exchange Market Data Gate

on:
  push:
    branches:
      - debug/multi-exchange-market-data
  pull_request:
    paths:
      - 'backend/src/MarketData/**'
      - 'backend/src/Trading/OrderService.php'
      - 'backend/src/Trading/AutoTraderEngine.php'
      - 'backend/src/Trading/BotController.php'
      - 'backend/src/Trading/NobitexAdaptiveExecutionPolicy.php'
      - 'backend/src/Trading/NobitexExternalMarketOracle.php'
      - 'backend/cron/tick.php'
      - 'backend/public/admin/exchanges.php'
      - 'backend/tests/multi_exchange_market_data_test.php'
      - '.github/workflows/multi-exchange-market-data.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl, pdo, pdo_mysql, sodium
          coverage: none
      - name: PHP syntax
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Multi-exchange regression
        run: php backend/tests/multi_exchange_market_data_test.php
      - name: Existing adaptive execution regression
        run: php backend/tests/adaptive_execution_policy_test.php
