name: Multi-Exchange Market Data Gate

on:
  push:
    branches: [main, debug/multi-exchange-market-data]
    paths:
      - 'backend/src/MarketData/**'
      - 'backend/src/Security/Crypto.php'
      - 'backend/src/Trading/Schema.php'
      - 'backend/src/Trading/NobitexSchema.php'
      - 'backend/src/Trading/BotController.php'
      - 'backend/src/Trading/NobitexOrderService.php'
      - 'backend/src/Trading/NobitexAdaptiveExecutionPolicy.php'
      - 'backend/src/Trading/NobitexExternalMarketOracle.php'
      - 'backend/public/index.php'
      - 'backend/public/install/index.php'
      - 'backend/public/admin/index.php'
      - 'backend/public/admin/exchanges.php'
      - 'backend/database/schema.sql'
      - 'backend/tests/multi_exchange_market_data_test.php'
      - 'backend/tests/bit24_credentials_test.php'
      - 'backend/tests/market_data_credentials_regression_test.php'
      - 'backend/tests/bitpin_market_data_only_cleanup_test.php'
      - 'backend/tests/nobitex_ambiguous_submission_recovery_test.php'
      - 'android/app/src/main/java/ir/trade/app/data/TradeApi.kt'
      - '.github/workflows/multi-exchange-market-data.yml'
  pull_request:
    paths:
      - 'backend/src/MarketData/**'
      - 'backend/src/Security/Crypto.php'
      - 'backend/src/Trading/**'
      - 'backend/public/**'
      - 'backend/database/schema.sql'
      - 'backend/tests/**'
      - 'android/app/src/main/java/ir/trade/app/data/TradeApi.kt'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl, pdo, pdo_mysql, sodium
          coverage: none
      - name: PHP syntax
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Multi-exchange regression
        run: php backend/tests/multi_exchange_market_data_test.php
      - name: Market-data credentials regression
        run: php backend/tests/market_data_credentials_regression_test.php
      - name: Bit24 credentials regression
        run: php backend/tests/bit24_credentials_test.php
      - name: Destructive legacy cleanup regression
        run: php backend/tests/bitpin_market_data_only_cleanup_test.php
      - name: Nobitex order rules regression
        run: php backend/tests/nobitex_order_rules_test.php
      - name: Nobitex ambiguous submission recovery regression
        run: php backend/tests/nobitex_ambiguous_submission_recovery_test.php
      - name: Existing adaptive execution regression
        run: php backend/tests/adaptive_execution_policy_test.php
