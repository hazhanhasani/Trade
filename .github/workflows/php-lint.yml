name: PHP Quality Gate
on:
  push:
    paths: ['backend/**', '.github/workflows/php-lint.yml']
  pull_request:
    paths: ['backend/**']
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, openssl
      - run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
