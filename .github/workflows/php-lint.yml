name: PHP Quality Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'android/app/src/main/java/ir/trade/app/data/ReleaseContract.kt'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'android/app/src/main/java/ir/trade/app/data/ReleaseContract.kt'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, openssl
      - name: PHP syntax
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Nobitex strategy regression tests
        run: php backend/tests/trading_strategy_test.php
      - name: Multi-strategy regime/router regression tests
        run: php backend/tests/multi_strategy_test.php
      - name: Strategy Learning v2 regression tests
        run: php backend/tests/strategy_learning_v2_test.php
      - name: Adaptive Edge Calibration regression tests
        run: php backend/tests/edge_calibration_test.php
      - name: Canonical Nobitex fill semantics regression tests
        run: php backend/tests/nobitex_order_fill_test.php
      - name: Nobitex fill integration regression tests
        run: php backend/tests/nobitex_fill_integration_test.php
      - name: Nobitex manual position reconciliation regression tests
        run: php backend/tests/nobitex_position_reconciliation_test.php
      - name: External Nobitex trade reconciliation v2 regression tests
        run: php backend/tests/nobitex_external_trade_reconciliation_test.php
      - name: Execution Learning v1 regression tests
        run: php backend/tests/execution_learning_v1_test.php
      - name: Adaptive Execution Policy v1 regression tests
        run: php backend/tests/adaptive_execution_policy_test.php
      - name: Nobitex order value guard regression tests
        run: php backend/tests/nobitex_order_value_guard_test.php
      - name: Nobitex runtime telemetry regression tests
        run: php backend/tests/nobitex_runtime_telemetry_test.php
      - name: Bale trade notification regression tests
        run: php backend/tests/bale_trade_notifier_test.php
      - name: Portfolio Intelligence v2 regression tests
        run: php backend/tests/portfolio_intelligence_test.php
      - name: Execution Quality v2 regression tests
        run: php backend/tests/execution_quality_v2_test.php
      - name: Nobitex currency unit regression tests
        run: php backend/tests/nobitex_currency_units_test.php
      - name: Nobitex Toman display v2 regression tests
        run: php backend/tests/nobitex_display_money_v2_test.php
      - name: Iran Solar Hijri clock regression tests
        run: php backend/tests/iran_clock_test.php
      - name: Admin mobile layout regression tests
        run: php backend/tests/admin_mobile_layout_test.php
      - name: Live admin observability regression tests
        run: php backend/tests/admin_live_observability_test.php
      - name: Trading settings and live hotfix regression tests
        run: php backend/tests/trading_admin_settings_regression_test.php
      - name: Validate Backend ↔ Android API contract parity
        shell: bash
        run: |
          set -euo pipefail
          php -r "require 'backend/bootstrap.php'; echo json_encode(Trade\\ReleaseContract::payload(), JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR);" > /tmp/backend-contract.json
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          backend = json.loads(pathlib.Path('/tmp/backend-contract.json').read_text())
          kotlin_path = pathlib.Path('android/app/src/main/java/ir/trade/app/data/ReleaseContract.kt')
          kotlin = kotlin_path.read_text()

          match = re.search(r'const\s+val\s+API_CONTRACT\s*=\s*(\d+)', kotlin)
          if not match:
              sys.exit('Android API_CONTRACT was not found.')

          backend_contract = int(backend.get('api_contract', -1))
          android_contract = int(match.group(1))
          if backend_contract < 1 or backend_contract != android_contract:
              sys.exit(f'API contract mismatch: backend={backend_contract}, android={android_contract}')

          block_match = re.search(
              r'REQUIRED_RUNTIME_CAPABILITIES\s*:\s*Set<String>\s*=\s*setOf\((.*?)\n\s*\)',
              kotlin,
              flags=re.S,
          )
          if not block_match:
              sys.exit('Android REQUIRED_RUNTIME_CAPABILITIES block was not found.')

          android_caps = set(re.findall(r'"([^"]+)"', block_match.group(1)))
          backend_caps = set(backend.get('capabilities') or [])
          missing = sorted(android_caps - backend_caps)
          if missing:
              sys.exit('Backend is missing Android-required capabilities: ' + ', '.join(missing))

          if 'api.capability_contract' not in backend_caps:
              sys.exit('Backend capability contract marker is missing.')

          print(f'Contract {backend_contract} OK; {len(android_caps)} Android-required capabilities satisfied.')
          PY
