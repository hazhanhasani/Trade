name: cPanel Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/cpanel-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Create deployment archive
        run: |
          mkdir -p dist
          zip -r dist/Trade-cPanel.zip backend \
            -x 'backend/storage/config.php' \
               'backend/storage/install.lock' \
               'backend/storage/*.log'
      - uses: actions/upload-artifact@v4
        with:
          name: Trade-cPanel
          path: dist/Trade-cPanel.zip
          if-no-files-found: error
