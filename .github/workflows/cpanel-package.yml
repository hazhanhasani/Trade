name: cPanel Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/cpanel-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Create easy cPanel deployment archive
        run: |
          rm -rf dist
          mkdir -p dist/package
          cp -a backend/. dist/package/
          rm -f dist/package/storage/config.php \
                dist/package/storage/install.lock \
                dist/package/storage/*.log
          (
            cd dist/package
            zip -r ../Trade-cPanel.zip .
          )

      - uses: actions/upload-artifact@v4
        with:
          name: Trade-cPanel
          path: dist/Trade-cPanel.zip
          if-no-files-found: error
